
<div style="display: flex">
   
  <mat-form-field style="flex: 1" gap 320px>
      <mat-label>Filter </mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Denis" #input>
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="addNewStudent()">Add student</button>

</div>

 <mat-paginator margin-left: auto
                    showFirstLastButtons
                    [pageSizeOptions]="[5, 10, 20]"
                    aria-label="Select page of students">
  </mat-paginator>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let student">{{ student.id }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Имя</th>
    <td mat-cell *matCellDef="let student">{{ student.name }}</td>
  </ng-container>

  <ng-container matColumnDef="surname">
    <th mat-header-cell *matHeaderCellDef>Фамилия</th>
    <td mat-cell *matCellDef="let student">{{ student.surname }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Действия</th>
    <td mat-cell *matCellDef="let student">
      <button mat-button color="primary" (click)="editStudent(student)">Edit</button>
      <button mat-button color="warn" (click)="deleteStudent(student)">Delete</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
  </tr>

</table>
